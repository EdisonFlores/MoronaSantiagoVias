name: Update ECU 911 cache

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update ECU 911 cache
        run: npm run update:ecu911
        env:
          CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

      - name: Commit cache changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar cache ECU 911"
          file_pattern: "data/ecu911-morona-santiago.json"
