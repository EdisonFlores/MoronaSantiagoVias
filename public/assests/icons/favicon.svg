<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradados Principales -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a75d3"/>
      <stop offset="70%" stop-color="#64b5f6"/>
      <stop offset="100%" stop-color="#e3f2fd"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#455a64"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#102027"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="signGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    
    <!-- Filtro de Sombra Suave -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- MAPA DE ECUADOR EN EL FONDO (Estilizado y sutil) -->
  <g id="background-map" opacity="0.15">
    <!-- Silueta continental simplificada de Ecuador -->
    <path d="M 40,160 C 60,130 90,120 120,110 C 150,100 190,80 230,80 C 260,80 270,100 290,110 C 310,120 330,110 350,120 C 370,130 380,160 390,190 C 400,220 420,240 410,270 C 400,300 370,310 360,330 C 350,350 360,380 340,410 C 320,440 290,430 270,440 C 250,450 240,470 210,470 C 180,470 170,440 150,430 C 130,420 120,430 110,410 C 100,390 110,360 100,340 C 90,320 60,310 50,290 C 40,270 50,250 50,230 C 50,210 30,190 40,160 Z" fill="#78909c" stroke="#546e7a" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- Región Insular (Galápagos) -->
    <circle cx="60" cy="90" r="8" fill="#78909c"/>
    <circle cx="75" cy="95" r="5" fill="#78909c"/>
    <circle cx="68" cy="105" r="6" fill="#78909c"/>
  </g>

  <!-- CONTENEDOR PRINCIPAL DEL EMBLEMA (Forma de Escudo Hexagonal Estilizado) -->
  <g id="main-emblem" filter="url(#dropShadow)">
    <!-- Borde Exterior Oscuro -->
    <polygon points="256,16 476,100 476,380 256,496 36,380 36,100" fill="url(#borderGrad)" stroke="#cfd8dc" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Línea Interna de Contraste Blanca -->
    <polygon points="256,26 460,104 460,372 256,480 52,372 52,104" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>
    
    <!-- Fondo del Paisaje (Cielo) Cortado dentro del Escudo -->
    <clipPath id="shieldClip">
      <polygon points="256,26 460,104 460,372 256,480 52,372 52,104"/>
    </clipPath>
    
    <g clip-path="url(#shieldClip)">
      <!-- Cielo -->
      <rect x="0" y="0" width="512" height="320" fill="url(#skyGrad)"/>
      
      <!-- Nubes -->
      <path d="M 120,70 Q 135,55 155,60 Q 175,45 195,60 Q 210,55 220,70 Z" fill="#ffffff" opacity="0.85"/>
      <path d="M 320,80 Q 335,65 355,70 Q 375,55 395,70 Q 410,65 420,80 Z" fill="#ffffff" opacity="0.85"/>

      <!-- Montañas del Fondo con Nieve -->
      <polygon points="120,240 256,70 320,240" fill="url(#mountainGrad)"/>
      <polygon points="216,115 256,70 275,115 265,110 256,120 245,110" fill="#ffffff"/>

      <polygon points="230,240 340,90 440,240" fill="#37474f"/>
      <polygon points="307,135 340,90 373,135 355,128 340,140 325,128" fill="#eceff1"/>

      <!-- Colinas Verdes -->
      <path d="M 40,260 Q 160,160 280,230 T 480,200 L 480,320 L 40,320 Z" fill="url(#hillGrad)"/>
      <path d="M 32,210 Q 120,180 220,220 T 480,170 L 480,320 L 32,320 Z" fill="#33691e" opacity="0.7"/>

      <!-- CARRETERA EN PERSPECTIVA -->
      <path d="M 245,190 L 265,190 L 380,320 L 80,320 Z" fill="url(#roadGrad)"/>
      <!-- Líneas de la Carretera -->
      <polygon points="253,190 257,190 240,320 230,320" fill="#ffffff" opacity="0.6"/>
      <polygon points="258,190 262,190 282,320 272,320" fill="#ffffff" opacity="0.6"/>
      <!-- Línea Discontinua Central -->
      <path d="M 255,195 L 255,210 M 255,220 L 255,240 M 255,255 L 255,280 M 255,295 L 255,325" stroke="#ffffff" stroke-width="4" stroke-dasharray="none" stroke-linecap="square"/>

      <!-- SEÑAL DE TRÁNSITO: RIESGO DE DESLIZAMIENTO (Izquierda) -->
      <g id="traffic-sign" transform="translate(75, 170) scale(0.85)" filter="url(#dropShadow)">
        <!-- Poste -->
        <rect x="45" y="80" width="10" height="90" fill="#78909c"/>
        <!-- Rombo de la Señal -->
        <g transform="rotate(45, 50, 50)">
          <rect x="0" y="0" width="100" height="100" rx="10" fill="url(#signGrad)" stroke="#1a1a1a" stroke-width="4"/>
          <rect x="5" y="5" width="90" height="90" rx="6" fill="none" stroke="#1a1a1a" stroke-width="2"/>
        </g>
        <!-- Icono de Derrumbe (Simplificado) -->
        <path d="M 25,65 L 75,65 L 50,30 Z" fill="#1a1a1a"/>
        <circle cx="35" cy="45" r="4" fill="#1a1a1a"/>
        <circle cx="45" cy="38" r="3" fill="#1a1a1a"/>
        <circle cx="60" cy="50" r="5" fill="#1a1a1a"/>
      </g>

      <!-- SEMÁFORO (Derecha) -->
      <g id="traffic-light" transform="translate(350, 160) scale(0.9)" filter="url(#dropShadow)">
        <!-- Estructura Principal -->
        <rect x="20" y="10" width="50" height="110" rx="10" fill="#263238" stroke="#37474f" stroke-width="2"/>
        <!-- Viseras de las Luces -->
        <path d="M 15,30 Q 45,15 75,30" fill="none" stroke="#263238" stroke-width="6"/>
        <path d="M 15,65 Q 45,50 75,65" fill="none" stroke="#263238" stroke-width="6"/>
        <path d="M 15,100 Q 45,85 75,100" fill="none" stroke="#263238" stroke-width="6"/>
        <!-- Luces -->
        <circle cx="45" cy="32" r="12" fill="#4caf50" filter="drop-shadow(0px 0px 4px #4caf50)"/> <!-- Verde Encendido -->
        <circle cx="45" cy="65" r="12" fill="#ffb300" opacity="0.3"/>
        <circle cx="45" cy="98" r="12" fill="#f44336" opacity="0.3"/>
      </g>

      <!-- PANEL INFERIOR DE INFORMACIÓN Y TEXTO -->
      <rect x="40" y="315" width="432" height="160" fill="url(#panelGrad)"/>
      <line x1="52" y1="315" x2="460" y2="315" stroke="#4caf50" stroke-width="4"/>

      <!-- TEXTO PRINCIPAL UNIFICADO: ECUAVIAL -->
      <text x="256" y="365" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.8))">ECUAVIAL</text>
      
      <!-- SUBTEXTO: VIAL -->
      <text x="256" y="405" font-family="'Montserrat', 'Arial', sans-serif" font-size="28" font-weight="bold" fill="#8bc34a" text-anchor="middle" letter-spacing="6">VIAL</text>

      <!-- LEYENDA DE ESTADO DE VÍAS (Estilo Cuadro de Control) -->
      <g id="legend" transform="translate(90, 425)">
        <!-- Estado Habilitada -->
        <circle cx="20" cy="12" r="7" fill="#4caf50"/>
        <text x="35" y="17" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1">HABILITADA</text>

        <!-- Estado Parcial -->
        <circle cx="160" cy="12" r="7" fill="#ffb300"/>
        <text x="175" y="17" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1">PARCIAL</text>

        <!-- Estado Cerrada -->
        <circle cx="280" cy="12" r="7" fill="#f44336"/>
        <text x="295" y="17" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1">CERRADA</text>
      </g>
    </g>
  </g>
</svg>
